# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.15.1! # datasource=node-version depName=node
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    # shfmt ignores .editorconfig when it is given any formatting flag, and
    # the plugin passes `-s`, so it would indent with tabs regardless of
    # indent_style. Run it without flags; `simplify = true` in .editorconfig
    # keeps the simplification.
    - name: shfmt
      commands:
        - name: format
          output: shfmt
          run: shfmt -w ${target}
          success_codes: [0, 1]
          cache_results: true
          formatter: true
          batch: true
          in_place: true

  enabled:
    - taplo@0.10.0
    - actionlint@1.7.12
    - git-diff-check
    - markdownlint@0.49.1
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - trufflehog@3.97.9
    - yamlfmt@0.21.0
    - yamllint@1.38.0
  disabled:
    - checkov
    - pinact
    - prettier
    - renovate
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
