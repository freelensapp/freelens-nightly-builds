name: Release nightly

on:
  pull_request:
    branches:
      - main
    # Only rebuild on PRs that touch the build recipe itself. Everything the
    # nightly builds comes from the upstream freelensapp/freelens checkout, so a
    # PR that only changes other CI (e.g. the mise-lock-check workflow) does not
    # need the full build matrix. schedule and workflow_dispatch are unaffected
    # by this filter.
    paths:
      - .github/workflows/release-nightly.yaml
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  make-draft-release:
    name: make draft release

    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout freelensapp/freelens
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: main

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.12 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Set current version
        id: version
        run: echo "version=$(yq -pj -oy '.version' freelens/package.json)-nightly-$(date +'%Y-%m-%d')" | tee -a $GITHUB_ENV

      - name: Set release tag
        id: tag
        run: echo "tag=v$version" | tee -a $GITHUB_ENV

      # A release of the same version that is already published stays as it
      # is and the rest of the run is skipped: it may already be on the other
      # channels. A draft is what a failed or cancelled run left behind, so it
      # is replaced. Any error other than a missing release fails the run
      # rather than risk deleting a published one.
      - name: Check existing nightly build
        id: existing
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        run: |
          if ! is_draft=$(gh release view $tag \
            --json isDraft \
            --jq .isDraft \
            --repo freelensapp/freelens-nightly-builds \
            2> "$RUNNER_TEMP/gh-error"); then
            if ! grep -q 'release not found' "$RUNNER_TEMP/gh-error"; then
              cat "$RUNNER_TEMP/gh-error" >&2
              exit 1
            fi
            is_draft=missing
          fi
          if [[ $is_draft == false ]]; then
            echo "::notice::GitHub release $tag is already published, skipping the build"
            echo "published=true" | tee -a $GITHUB_OUTPUT
          elif [[ $is_draft == true ]]; then
            echo "draft=true" | tee -a $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A draft has no git tag yet, so it is deleted without --cleanup-tag.
      - name: Delete existing nightly build
        if: github.ref_name == 'main' && github.event_name != 'pull_request' && steps.existing.outputs.draft == 'true'
        run: |
          gh release delete $tag \
            --yes \
            --repo freelensapp/freelens-nightly-builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly build draft
        if: github.ref_name == 'main' && github.event_name != 'pull_request' && steps.existing.outputs.published != 'true'
        run: |
          gh release create $tag \
            --draft \
            --title "Nightly build $tag" \
            --repo freelensapp/freelens-nightly-builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      version: ${{ env.version }}
      tag: ${{ env.tag }}
      published: ${{ steps.existing.outputs.published }}

  build-app:
    name: build app

    # Every later job needs this one, so skipping it skips the rest of the run.
    if: needs.make-draft-release.outputs.published != 'true'

    needs:
      - make-draft-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            os: linux
            arch: x64

          - runs-on: ubuntu-24.04-arm
            os: linux
            arch: arm64

          - runs-on: macos-15
            os: macos
            arch: arm64

          - runs-on: macos-15-intel
            os: macos
            arch: x64

          - runs-on: windows-11-arm
            os: windows
            arch: arm64

          - runs-on: windows-2025
            os: windows
            arch: x64

    runs-on: ${{ matrix.runs-on }}
    environment: ${{ github.ref_name == 'main' && 'test-signing' || null }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}

    env:
      DO_NOT_TRACK: "1"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      # The Syft that creates the SBOMs. anchore/sbom-action@v0 defaults to an
      # older one, without the Go symbol capture a vulnerability scan needs
      # (see Create syft-json SBOM). Stored without the leading "v"
      # because the Renovate manager that bumps it strips the "v" on every
      # bump; it is re-added where this is consumed.
      SYFT_VERSION: 1.54.1 # datasource=github-releases depName=anchore/syft

    steps:
      - name: Checkout freelensapp/freelens
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: main

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tmp/nightly-builds

      - name: Save current revision
        id: current_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bash coreutils

      - name: Add coreutils to PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "/usr/local/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock. It replaces the manual
      # per-platform yq download and works the same on every runner, including
      # the windows-11-arm image where winget/choco is unavailable.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.12 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ${{ matrix.runs-on }}-${{ matrix.arch }}-node-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ matrix.runs-on }}-${{ matrix.arch }}-node-

      - name: Disable pre post scripts for pnpm
        shell: bash
        run: pnpm config set enablePrePostScripts false --location project

      - name: Get Electron version
        shell: bash
        # pnpm-lock.yaml holds several YAML documents (pnpm 12 puts packageManagerDependencies
        # in a document of its own), so evaluate them all and take the one that has the importer.
        # The version carries a peer suffix, e.g. 1.2.3(supports-color@8.1.1), which split drops.
        run: |
          electron_version=$(yq ea -r '[.importers.freelens.devDependencies.electron.version | select(. != null)] | .[0] // error("electron not found in pnpm-lock.yaml") | split("(") | .[0]' pnpm-lock.yaml)
          echo "electron_version=${electron_version}" | tee -a "${GITHUB_ENV}"

      - name: Get Electron Builder version
        shell: bash
        # Same multi-document lookup as the Electron version above.
        run: |
          electron_builder_version=$(yq ea -r '[.importers.freelens.devDependencies.electron-builder.version | select(. != null)] | .[0] // error("electron-builder not found in pnpm-lock.yaml") | split("(") | .[0]' pnpm-lock.yaml)
          echo "electron_builder_version=${electron_builder_version}" | tee -a "${GITHUB_ENV}"

      # electron-builder's Electron zip downloader doesn't accept a cache
      # directory override and always writes into the OS-default Electron cache
      # dir (see freelensapp/freelens#2305). Point both the "Install Electron
      # binary" step and this cache at that real directory so the two share one
      # @electron/get cache and electron-builder reuses the pre-downloaded
      # binary instead of fetching it again.
      - name: Get Electron cache directory
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            linux) dir="$HOME/.cache/electron" ;;
            macos) dir="$HOME/Library/Caches/electron" ;;
            windows) dir="$LOCALAPPDATA/electron/Cache" ;;
          esac
          echo "electron_cache_dir=$dir" | tee -a $GITHUB_ENV

      # Split restore/save (save runs under if: always() after the build steps
      # below) so a packaging failure that happens after the binaries finish
      # downloading still saves the cache. The combined actions/cache action
      # only saves in a post-job step that a failed job skips
      # (freelensapp/freelens#2303).
      - name: Restore Electron cache
        id: electron-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.electron_cache_dir }}
          key: ${{ matrix.runs-on }}-${{ matrix.arch }}-electron-${{ env.electron_version }}
          restore-keys: |
            ${{ matrix.runs-on }}-${{ matrix.arch }}-electron-

      - name: Restore Electron Builder cache
        id: electron-builder-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ matrix.runs-on }}-${{ matrix.arch }}-electron-builder-${{ env.electron_builder_version }}
          restore-keys: |
            ${{ matrix.runs-on }}-${{ matrix.arch }}-electron-builder-

      # kubectl, helm and freelens-k8s-proxy, which upstream's Turborepo does
      # not cache. The build hashes every restored file against
      # freelens/binaries.lock.json and downloads it again on a mismatch, so a
      # stale or tampered cache costs a download, not a bad binary (see
      # "Bundled Binary Versions" in freelensapp/freelens AGENTS.md). Saved
      # right after the build.
      - name: Restore bundled binaries cache
        id: binaries-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: freelens/binaries
          key: ${{ matrix.runs-on }}-${{ matrix.arch }}-binaries-${{ hashFiles('freelens/binaries.lock.json') }}
          restore-keys: |
            ${{ matrix.runs-on }}-${{ matrix.arch }}-binaries-

      - name: Tweak package for nightly build
        shell: bash
        run: |
          yq -pj -oj -i ".version = \"$version\"" freelens/package.json
          cp -f tmp/nightly-builds/apt/* freelens/build/apt
          yq -py -oy -i '.deb.fpm += ["./build/apt/freelens-nightly-builds.asc=/etc/apt/keyrings/freelens-nightly-builds.asc", "./build/apt/freelens-nightly-builds.sources=/etc/apt/sources.list.d/freelens-nightly-builds.sources"]' freelens/electron-builder.yml
        env:
          version: ${{ needs.make-draft-release.outputs.version }}

      - name: Install pnpm dependencies
        id: install-pnpm
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile

      # Electron downloads its runtime binary lazily on the first require(),
      # not during pnpm install (pnpm runs no dependency build scripts by
      # default, and node-pty now ships prebuilds so nothing rebuilds Electron
      # either). Fetch and extract it once here, into the same OS-default
      # @electron/get cache directory electron-builder uses at pack time, so
      # electron-builder reuses it instead of re-downloading it (see
      # freelensapp/freelens#2305). electron/install.js reads its cache dir
      # from electron_config_cache.
      - name: Install Electron binary
        shell: bash
        working-directory: freelens
        env:
          electron_config_cache: ${{ env.electron_cache_dir }}
        run: node "$(node -p "require.resolve('electron/install.js')")"

      - name: Build packages
        if: runner.os != 'Windows'
        run: pnpm --color=always --stream build

      # STATUS_DLL_INIT_FAILED (0xC0000142) intermittently crashes turbo's
      # child build processes on the GitHub-hosted Windows runners when the
      # build fans out across all packages at once (see issue #105). Cap
      # turbo's concurrency on Windows to lower the parallelism and memory
      # pressure that trigger the crash; other platforms keep turbo's default.
      - name: Build packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm --color=always --stream build
        env:
          TURBO_CONCURRENCY: "2"

      - name: Build extra resources
        id: build-resources
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.build-resources.outcome == 'failure'
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.build-resources-2.outcome == 'failure'
        run: pnpm --color=always build:resources

      - name: Save bundled binaries cache
        if: steps.binaries-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: freelens/binaries
          key: ${{ steps.binaries-cache-restore.outputs.cache-primary-key }}

      - name: Build Electron app (macOS)
        id: build-macos
        if: runner.os == 'macOS'
        run: |
          for var in APPLEID APPLEIDPASS APPLETEAMID CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; do
            test -n "${!var}" || unset $var
          done
          pnpm --color=always build:app \
            dmg pkg \
            --${{ matrix.arch }}
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          DEBUG: electron-builder,electron-builder:*
        continue-on-error: true

      # Retry once to absorb a transient Electron/toolset download failure
      # during packaging (see freelensapp/freelens#2303). Rebuilding and
      # re-signing from scratch is idempotent; notarization happens in the
      # separate steps below.
      - name: Build Electron app (macOS) (retry)
        if: runner.os == 'macOS' && steps.build-macos.outcome == 'failure'
        run: |
          for var in APPLEID APPLEIDPASS APPLETEAMID CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; do
            test -n "${!var}" || unset $var
          done
          pnpm --color=always build:app \
            dmg pkg \
            --${{ matrix.arch }}
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          DEBUG: electron-builder,electron-builder:*

      # Only notarizes: the ticket is stapled by the staple-pkg job, so that a
      # failed staple can be re-run on its own instead of the whole build. The
      # step fails unless Apple accepted the PKG, because the exit status of
      # notarytool is lost in the pipe to tee and an empty uuid skips the log.
      - name: Notarize PKG (macOS)
        id: notarize-pkg
        if: runner.os == 'macOS'
        run: |
          if [[ -n $APPLEID && -n $APPLEIDPASS && -n $APPLETEAMID ]]; then
            pkgname=$(ls -1 freelens/dist/Freelens*.pkg | head -n1)
            auth="--apple-id $APPLEID --password $APPLEIDPASS --team-id $APPLETEAMID"
            xcrun notarytool submit $pkgname $auth --wait 2>&1 | tee freelens/dist/notarytool.log
            uuid=$(awk '/id: / { print $2; exit; }' freelens/dist/notarytool.log)
            sleep 60
            if [[ -n $uuid ]]; then
              xcrun notarytool log $uuid $auth
            fi
            grep -qE '^ +status: Accepted$' freelens/dist/notarytool.log
          fi
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
        continue-on-error: true

      - name: Notarize PKG (macOS) (retry)
        id: notarize-pkg-2
        if: runner.os == 'macOS' && steps.notarize-pkg.outcome == 'failure'
        run: |
          if [[ -n $APPLEID && -n $APPLEIDPASS && -n $APPLETEAMID ]]; then
            sleep 600
            pkgname=$(ls -1 freelens/dist/Freelens*.pkg | head -n1)
            auth="--apple-id $APPLEID --password $APPLEIDPASS --team-id $APPLETEAMID"
            xcrun notarytool submit $pkgname $auth --wait 2>&1 | tee freelens/dist/notarytool.log
            uuid=$(awk '/id: / { print $2; exit; }' freelens/dist/notarytool.log)
            sleep 60
            if [[ -n $uuid ]]; then
              xcrun notarytool log $uuid $auth
            fi
            grep -qE '^ +status: Accepted$' freelens/dist/notarytool.log
          fi
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
        continue-on-error: true

      - name: Notarize PKG (macOS) (retry 2)
        if: runner.os == 'macOS' && steps.notarize-pkg-2.outcome == 'failure'
        run: |
          if [[ -n $APPLEID && -n $APPLEIDPASS && -n $APPLETEAMID ]]; then
            sleep 600
            pkgname=$(ls -1 freelens/dist/Freelens*.pkg | head -n1)
            auth="--apple-id $APPLEID --password $APPLEIDPASS --team-id $APPLETEAMID"
            xcrun notarytool submit $pkgname $auth --wait 2>&1 | tee freelens/dist/notarytool.log
            uuid=$(awk '/id: / { print $2; exit; }' freelens/dist/notarytool.log)
            sleep 60
            if [[ -n $uuid ]]; then
              xcrun notarytool log $uuid $auth
            fi
            grep -qE '^ +status: Accepted$' freelens/dist/notarytool.log
          fi
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAMID: ${{ secrets.APPLETEAMID }}

      - name: Build Electron app (Linux)
        id: build-linux
        if: runner.os == 'Linux'
        run: |
          pnpm --color=always build:app \
            AppImage deb rpm \
            --${{ matrix.arch }}
        env:
          DEBUG: electron-builder,electron-builder:*
        continue-on-error: true

      # Retry once to absorb a transient Electron/toolset download failure
      # during packaging (see freelensapp/freelens#2303).
      - name: Build Electron app (Linux) (retry)
        if: runner.os == 'Linux' && steps.build-linux.outcome == 'failure'
        run: |
          pnpm --color=always build:app \
            AppImage deb rpm \
            --${{ matrix.arch }}
        env:
          DEBUG: electron-builder,electron-builder:*

      # Windows is built in two phases so the native binaries that electron
      # unpacks next to the app (node-pty's pty.node / conpty.node /
      # conpty_console_list.node, conpty.dll and the bundled CLI .exe files)
      # can be code-signed *before* they are packed into the installers.
      # Otherwise those files ship unsigned inside the installer and are
      # quarantined by anti-malware engines such as Trellix (see issue #97).
      #
      # Phase 1: produce the unpacked app directory only (no installers).
      - name: Build Electron app directory (Windows)
        id: build-windows-dir
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm --color=always build:app \
            dir \
            --${{ matrix.arch }}
        env:
          DEBUG: electron-builder,electron-builder:*
        continue-on-error: true

      # Retry once to absorb a transient Electron/toolset download failure
      # during packaging (see freelensapp/freelens#2303).
      - name: Build Electron app directory (Windows) (retry)
        if: runner.os == 'Windows' && steps.build-windows-dir.outcome == 'failure'
        shell: bash
        run: |
          pnpm --color=always build:app \
            dir \
            --${{ matrix.arch }}
        env:
          DEBUG: electron-builder,electron-builder:*

      - name: Verify app.asar
        shell: bash
        run: |
          set -eo pipefail
          found=0
          while IFS= read -r asar; do
            tmpdir=$(mktemp -d)
            echo "::group::asar extract ${asar}"
            pnpm dlx @electron/asar extract "${asar}" "${tmpdir}"
            echo "::endgroup::"
            rm -rf "${tmpdir}"
            found=$((found + 1))
          done < <(find freelens/dist -type f -name app.asar)
          if [[ "${found}" -eq 0 ]]; then
            echo "No app.asar found under freelens/dist" >&2
            exit 1
          fi

      # Phase 2a: collect the native binaries to sign inside the unpacked app
      # directory (recursing into resources/app.asar.unpacked where the .node
      # modules live). electron-builder names the directory win-unpacked for
      # x64 and win-arm64-unpacked for arm64.
      #
      # Only Windows PE binaries can be code-signed by Azure Trusted Signing.
      # The tree still contains native modules built for other platforms that
      # electron-builder excludes from the package at pack time (node-pty's
      # prebuilds/<os>-<arch>/*.node and pnpm's reflink.<os>-<arch>-*.node).
      # Those are Mach-O/ELF files and make the signer fail (see issue #97), so
      # filter the candidates down to actual PE files using `file` before
      # handing the list to the signing action.
      - name: List unpacked binaries to sign (Windows)
        id: sign-list
        if: runner.os == 'Windows' && github.ref_name == 'main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            arm64) unpacked="win-arm64-unpacked" ;;
            *) unpacked="win-unpacked" ;;
          esac
          ws='${{ github.workspace }}'
          dir="freelens/dist/$unpacked"
          list="$RUNNER_TEMP/sign-files.txt"
          : > "$list"
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'PE32'; then
              # Emit a Windows-style absolute path for the signing action.
              rel="${f#./}"
              printf '%s\\%s\n' "$ws" "${rel//\//\\}" >> "$list"
            fi
          done < <(find "$dir" -type f \( -iname '*.dll' -o -iname '*.exe' -o -iname '*.node' \) -print0)
          if [[ ! -s "$list" ]]; then
            echo "No Windows PE binaries found under ${dir} to sign" >&2
            exit 1
          fi
          echo "Files to sign:"
          cat "$list"
          {
            echo "files<<SIGN_EOF"
            cat "$list"
            echo "SIGN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Azure Trusted Signing unpacked binaries (Windows)
        if: runner.os == 'Windows' && github.ref_name == 'main' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE_NAME }}
          files: ${{ steps.sign-list.outputs.files }}

      # Phase 2b: pack the already-signed directory into the installers without
      # rebuilding it (--prepackaged), so the signed binaries are preserved.
      # TURBO_FORCE avoids turbo restoring a cached, unsigned dist directory.
      - name: Build Electron app installers (Windows)
        id: build-windows-installers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            arm64) unpacked="win-arm64-unpacked" ;;
            *) unpacked="win-unpacked" ;;
          esac
          pnpm --color=always build:app \
            msi nsis portable \
            --prepackaged "$GITHUB_WORKSPACE/freelens/dist/$unpacked" \
            --${{ matrix.arch }}
        env:
          DEBUG: electron-builder,electron-builder:*
          TURBO_FORCE: "true"
        continue-on-error: true

      # Retry once to absorb a transient toolset download failure (NSIS,
      # winCodeSign, ...) during installer packaging (see
      # freelensapp/freelens#2303). Runs against the already-signed unpacked
      # dir, so it only re-runs the installer assembly.
      - name: Build Electron app installers (Windows) (retry)
        if: runner.os == 'Windows' && steps.build-windows-installers.outcome == 'failure'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            arm64) unpacked="win-arm64-unpacked" ;;
            *) unpacked="win-unpacked" ;;
          esac
          pnpm --color=always build:app \
            msi nsis portable \
            --prepackaged "$GITHUB_WORKSPACE/freelens/dist/$unpacked" \
            --${{ matrix.arch }}
        env:
          DEBUG: electron-builder,electron-builder:*
          TURBO_FORCE: "true"

      # Save the Electron and electron-builder caches unconditionally (the
      # counterpart to the split restore steps above): whatever the build steps
      # downloaded is cached even when a later packaging/signing step fails, so
      # a re-run does not re-download the binaries (freelensapp/freelens#2303).
      # Skip on an exact cache hit (the primary key already exists, so the save
      # would only warn "Unable to reserve cache ...").
      - name: Save Electron cache
        if: always() && steps.electron-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.electron_cache_dir }}
          key: ${{ steps.electron-cache-restore.outputs.cache-primary-key }}

      - name: Save Electron Builder cache
        if: always() && steps.electron-builder-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ steps.electron-builder-cache-restore.outputs.cache-primary-key }}

      - name: Azure Trusted Signing (Windows)
        if: runner.os == 'Windows' && github.ref_name == 'main' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\freelens\dist
          files-folder-filter: exe,msi

      - name: Tweak binaries
        shell: bash
        run: |
          find . -name '*pty.node' -print0 | xargs -0 file
          rm -f freelens/dist/*.blockmap

      - name: Normalize filenames before upload
        shell: bash
        run: |
          perl << 'END'
          chdir "freelens/dist" or die $!;
          my %arch = (x64 => "amd64", arm64 => "arm64");
          my $arch = $arch{$ENV{ARCH}};
          while (<Freelens*>) {
            my $src = $_;
            s/[ _]/-/g;
            if (/\.(dmg|exe|msi|pkg)$/ && !/-(amd64|arm64)\./) {
              s/\.(dmg|exe|msi|pkg)$/-$arch.$1/;
            }
            s/[.-](aarch64|arm64)/-arm64/;
            s/[.-](amd64|x86-64)/-amd64/;
            s/-(amd64|arm64).(dmg|pkg)$/-macos-$1.$2/;
            s/-(amd64|arm64).(AppImage|deb|flatpak|rpm|snap)$/-linux-$1.$2/;
            s/-(amd64|arm64)\.msi$/-windows-$1.msi/;
            s/-(amd64|arm64)\.exe$/-windows-portable-$1.exe/ if !/-Setup-/;
            s/-(amd64|arm64)\.exe$/-windows-$1.exe/ if /-Setup-/;
            s/-Setup-/-/;
            my $dst = $_;
            if ($src ne $dst) {
              print "rename $src to $dst\n";
              rename $src, $dst or die $!;
            }
          }
          END
        env:
          ARCH: ${{ matrix.arch }}

      # Stapling rewrites the PKG, so this leg must not checksum or publish it:
      # the staple-pkg job takes it from here as a run artifact and does both
      # after stapling. Kept for a few days only, enough to re-run that job.
      - name: Upload PKG for stapling (macOS)
        if: runner.os == 'macOS' && github.ref_name == 'main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-macos-${{ matrix.arch == 'x64' && 'amd64' || matrix.arch }}-pkg"
          path: freelens/dist/Freelens-*.pkg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove PKG from upload (macOS)
        if: runner.os == 'macOS' && github.ref_name == 'main' && github.event_name != 'pull_request'
        shell: bash
        run: rm -v freelens/dist/Freelens-*.pkg

      - name: Make checksums for binaries (Linux, Windows)
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          for f in freelens/dist/Freelens*.*; do
            pushd freelens/dist > /dev/null
            sha256sum $(basename $f) | tee $(basename $f).sha256
            popd > /dev/null
          done

      - name: Make checksums for binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in freelens/dist/Freelens*.*; do
            pushd freelens/dist > /dev/null
            shasum -a 256 $(basename $f) | tee $(basename $f).sha256
            popd > /dev/null
          done

      - name: Create SBOM
        uses: anchore/sbom-action@v0
        with:
          # The "v" is added here, not in SYFT_VERSION: the installer resolves
          # the value as a literal git tag, and a bare version 404s.
          syft-version: v${{ env.SYFT_VERSION }}
          format: spdx-json
          output-file: "freelens/dist/${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch == 'x64' && 'amd64'
            || matrix.arch }}-sbom.spdx.json"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: "${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch == 'x64' && 'amd64' || matrix.arch
            }}-sbom.spdx.json"
          upload-release-assets: false

      # The SBOM to scan for vulnerabilities, published next to the SPDX one
      # above. It is syft-json with Go symbol capture, because Grype matches a Go
      # advisory against the vulnerable functions it names only when the
      # package carries the symbols compiled into the binary. Without them it
      # falls back to the whole module and reports advisories for code the
      # binary never contains. Only syft-json can carry the symbols: SPDX and
      # CycloneDX have no field for them.
      #
      # Created by the same Syft from the same tree as the SPDX SBOM, so the
      # two describe the same build. Syft does not read SBOM files in a
      # directory scan unless asked to, so the SPDX SBOM does not show up in
      # this one.
      - name: Create syft-json SBOM
        uses: anchore/sbom-action@v0
        env:
          SYFT_GOLANG_CAPTURE_SYMBOLS: all
        with:
          syft-version: v${{ env.SYFT_VERSION }}
          format: syft-json
          output-file: "freelens/dist/${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch == 'x64' && 'amd64'
            || matrix.arch }}-sbom.syft.json"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - name: Create runtime package list
        shell: bash
        run: |
          set -eo pipefail
          # Assemble a production-only dependency tree (no devDependencies) from
          # the already-populated pnpm store, then map each runtime package
          # <name>@<version> to its path in the pnpm store. publish-runtime-package-list
          # merges the per-platform lists into the one published with the release:
          # the SBOM above covers the whole build workspace, so a scan needs the
          # keys as the runtime closure (to drop build-time findings) and the
          # paths as the reported location for npm findings (grype otherwise
          # reports them against pnpm-lock.yaml). --legacy is required because the
          # workspace does not set inject-workspace-packages, and
          # allow-unused-patches because patchedDependencies also patches
          # devDependencies, which a production deploy does not install. The
          # lowercase repo-name prefix keeps this file out of the Freelens*.*
          # release-upload glob; it travels as a run artifact instead.
          deploy_dir="$RUNNER_TEMP/freelens-prod"
          rm -rf "$deploy_dir"
          pnpm --filter freelens deploy --prod --legacy --ignore-scripts --config.allow-unused-patches=true "$deploy_dir"
          os="${{ matrix.os }}"
          arch="${{ matrix.arch == 'x64' && 'amd64' || matrix.arch }}"
          out="freelens/dist/${{ github.event.repository.name }}-${os}-${arch}-prod-packages.json"
          (
            cd "$deploy_dir"
            printf 'key\tvalue\n'
            for d in node_modules/.pnpm/*/; do
              d="${d#node_modules/.pnpm/}"
              d="${d%/}"
              [ "$d" = "node_modules" ] && continue
              # dir name is <name>@<version>[_<peer>]; drop the peer suffix and
              # decode the scoped-package separator (@scope+name -> @scope/name).
              key="${d%%_*}"
              key="${key/+//}"
              printf '%s\t%s\n' "$key" "node_modules/.pnpm/$d/node_modules/${key%@*}"
            done
          ) | yq -pt -oj '.[] as $i ireduce ({}; . * {$i.key: $i.value})' > "$out"
          echo "runtime packages: $(yq -pj -oj 'length' "$out")"

      - name: Upload runtime package list
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch == 'x64' && 'amd64' || matrix.arch }}-prod-packages.json"
          path: "freelens/dist/${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch == 'x64' && 'amd64' ||
            matrix.arch }}-prod-packages.json"

      - name: Normalize SBOM filename
        shell: bash
        run: |
          version="${{ needs.make-draft-release.outputs.version }}"
          os="${{ matrix.os }}"
          arch="${{ matrix.arch == 'x64' && 'amd64' || matrix.arch }}"
          for f in freelens/dist/*-sbom.spdx.json freelens/dist/*-sbom.syft.json; do
            newname="freelens/dist/Freelens-${version}-${os}-${arch}-sbom.${f##*-sbom.}"
            mv "$f" "$newname"
            if [ -f "${f}.sha256" ]; then
              mv "${f}.sha256" "${newname}.sha256"
            fi
          done

      - name: Make checksum for SBOM (Linux, Windows)
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          for f in freelens/dist/*-sbom.spdx.json freelens/dist/*-sbom.syft.json; do
            pushd freelens/dist > /dev/null
            sha256sum $(basename $f) | tee $(basename $f).sha256
            popd > /dev/null
          done

      - name: Make checksum for SBOM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in freelens/dist/*-sbom.spdx.json freelens/dist/*-sbom.syft.json; do
            pushd freelens/dist > /dev/null
            shasum -a 256 $(basename $f) | tee $(basename $f).sha256
            popd > /dev/null
          done

      - name: List files before upload
        shell: bash
        run: |
          for f in freelens/dist/Freelens*.*; do
            echo "$(ls -l "$f")" "|" "$(file -b "$f")"
          done

      # Every artifact this leg publishes has a .sha256 next to it by now, in
      # sha256sum format and named exactly as the release names it - which is
      # the subject list attest-artifacts needs. It travels as a run artifact
      # because the release is still a draft here.
      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch == 'x64' && 'amd64' || matrix.arch }}-checksums"
          path: freelens/dist/Freelens-*.sha256

      - name: Upload files
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          gh release upload $tag \
            freelens/dist/Freelens*.* \
            --repo freelensapp/freelens-nightly-builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.make-draft-release.outputs.tag }}

    outputs:
      sha: ${{ steps.current_revision.outputs.sha }}

  add-notes-to-release:
    name: add notes to release

    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - make-draft-release
      - build-app

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add notes to nightly build
        run: |
          gh release edit $tag \
            --notes="Based on https://github.com/freelensapp/freelens/commit/$revision"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.make-draft-release.outputs.tag }}
          revision: ${{ needs.build-app.outputs.sha }}

  staple-pkg:
    name: staple PKG

    # Attaches the notarization ticket to the PKGs that build-app notarized.
    # stapler fetches the ticket from Apple's CloudKit, and from the GitHub
    # macOS runners, Intel and arm64 alike, that connection is sometimes
    # dropped ("The network connection was lost", error 68), at times for
    # every attempt within a job. As a job of its own it can be re-run without
    # rebuilding anything, the same way upstream publishes npm packages after
    # the build.
    #
    # It needs no Apple credentials: the ticket is public, looked up by the
    # code directory hash. An arm64 runner staples the x64 PKG just as well.
    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - make-draft-release
      - build-app

    runs-on: macos-15

    steps:
      - name: Download PKGs
        uses: actions/download-artifact@v8
        with:
          pattern: "*-pkg"
          path: pkg
          merge-multiple: true

      # stapler staple validates the ticket itself ("The staple and validate
      # action worked!"), so a separate stapler validate would only be one
      # more CloudKit request outside the retries.
      - name: Staple PKGs
        shell: bash
        run: |
          set -eo pipefail
          shopt -s nullglob
          pkgs=(pkg/Freelens-*.pkg)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "No PKG to staple" >&2
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            attempt=1
            until xcrun stapler staple "$pkg"; do
              if [[ $attempt -ge 5 ]]; then
                echo "::error::Stapling $pkg failed $attempt times"
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 60
            done
          done

      - name: Make checksums for PKGs
        shell: bash
        run: |
          for f in pkg/Freelens-*.pkg; do
            pushd pkg > /dev/null
            shasum -a 256 $(basename $f) | tee $(basename $f).sha256
            popd > /dev/null
          done

      # --clobber, because a re-run may find the assets of an attempt that
      # failed halfway through the upload.
      - name: Upload files
        shell: bash
        run: |
          gh release upload $tag \
            pkg/Freelens-*.pkg* \
            --clobber \
            --repo freelensapp/freelens-nightly-builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.make-draft-release.outputs.tag }}

      # Same as in build-app: attest-artifacts collects the checksums of
      # everything published. overwrite, because a re-run of this job must
      # replace the artifact of an earlier attempt.
      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-macos-pkg-checksums"
          path: pkg/Freelens-*.pkg.sha256
          overwrite: true

  publish-runtime-package-list:
    name: publish runtime package list

    # The runtime package list says which npm packages of the build actually
    # reach a user's machine, published alongside the SBOMs so a later scan can
    # reduce them - the SBOMs cover the whole build workspace, devDependencies
    # included - to what ships.
    #
    # One asset, not one per platform: every build resolves the same npm closure
    # from the same lockfile, so per-platform copies would be identical files on
    # the release page. It is still merged from all of them rather than taken
    # from one, so a dependency that some day resolves only on one platform stays
    # in the set instead of silently dropping out everywhere else.
    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - make-draft-release
      - build-app

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      contents: write

    steps:
      # Only needed for mise.toml and mise.lock: this job merges the lists with
      # yq and nothing else here reads the working tree.
      - name: Checkout
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.12 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Download runtime package lists
        uses: actions/download-artifact@v8
        with:
          pattern: "*-prod-packages.json"
          path: prod
          merge-multiple: true

      - name: Merge the runtime package lists
        shell: bash
        env:
          version: ${{ needs.make-draft-release.outputs.version }}
        run: |
          set -eo pipefail
          shopt -s nullglob
          out="Freelens-${version}-prod-packages.json"
          # Union of the per-platform <name>@<version> -> pnpm-store-path maps.
          yq ea -pj -oj '. as $i ireduce ({}; . * $i)' prod/*-prod-packages.json > "$out"
          count=$(yq -pj -oj 'length' "$out")
          if [[ "$count" -eq 0 ]]; then
            echo "Merged runtime package list is empty - refusing to publish it" >&2
            exit 1
          fi
          sha256sum "$out" | tee "$out.sha256"
          echo "runtime packages: $count"

      - name: Upload files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.make-draft-release.outputs.tag }}
        run: |
          gh release upload $tag \
            Freelens-*-prod-packages.json* \
            --repo freelensapp/freelens-nightly-builds

      # Same as in build-app: the checksum of what this job publishes goes to
      # attest-artifacts as a run artifact, so the list it attests covers every
      # release asset and not just the ones the matrix produced.
      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-prod-packages-checksums"
          path: Freelens-*-prod-packages.json.sha256

  attest-artifacts:
    name: attest build provenance

    # Signs a statement that these exact bytes were built by this workflow, from
    # this commit, so `gh attestation verify <file> --repo <owner>/<repo>` can
    # confirm a downloaded installer came from here rather than from someone who
    # merely renamed a file. publish-release waits on it, so the release is never
    # published without its attestation.
    #
    # The subjects come from the .sha256 files the jobs above already produce -
    # collected as run artifacts - rather than from the draft release: reading a
    # draft needs a token with more reach, and the digests are identical either
    # way.
    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - make-draft-release
      - build-app
      - staple-pkg
      - publish-runtime-package-list

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download checksums
        uses: actions/download-artifact@v8
        with:
          pattern: "*-checksums"
          path: checksums
          merge-multiple: true

      - name: Collect attestation subjects
        run: |
          set -eo pipefail
          shopt -s nullglob
          # Each .sha256 is one sha256sum line naming the asset exactly as the
          # release names it, which is what `gh attestation verify` matches on.
          # sort -u only orders them; a duplicate would mean two jobs published
          # the same asset name.
          #
          # The Windows lines read "<digest> *<name>" rather than "<digest>
          # <name>" because sha256sum there defaults to binary mode. Left as is
          # on purpose: the action strips a leading '*' or ' ' from the name
          # itself, and rewriting the digest lines here would only add a way to
          # get them wrong.
          cat checksums/*.sha256 | sort -u > attestation-checksums.txt
          cat attestation-checksums.txt
          count=$(wc -l < attestation-checksums.txt)
          if [[ "$count" -eq 0 ]]; then
            echo "No checksums collected - refusing to attest nothing" >&2
            exit 1
          fi
          echo "subjects: $count"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: attestation-checksums.txt

  publish-release:
    name: publish release

    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - make-draft-release
      - build-app
      - add-notes-to-release
      - staple-pkg
      - publish-runtime-package-list
      - attest-artifacts

    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish nightly build
        run: |
          gh release edit $tag \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.make-draft-release.outputs.tag }}

      # A draft has no git tag yet, so deleting it with --cleanup-tag fails
      # with "Reference does not exist" after the release itself is gone.
      - name: Delete old nightly builds
        run: |
          gh release list \
            --limit 100 \
            --json tagName,isDraft \
            --jq '.[] | "\(.tagName) \(.isDraft)"' | \
            sort -r -V | \
            sed 1,10d | \
            while read -r old is_draft; do
              if [[ $is_draft == true ]]; then
                gh release delete $old --yes
              else
                gh release delete $old --cleanup-tag --yes
              fi
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-apt-repository:
    name: release APT repository

    if: github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - make-draft-release
      - publish-release

    runs-on: ubuntu-24.04-arm
    environment: apt-signing

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: GPG configuration
        run: |
          mkdir -p -m 0700 $HOME/.gnupg
          echo "use-agent" > $HOME/.gnupg/gpg.conf
          echo "pinentry-program $GITHUB_WORKSPACE/.github/scripts/pinentry.sh" > $HOME/.gnupg/gpg-agent.conf
          echo "$GPG_PASSPHRASE" > $HOME/.gnupg/passphrase
          gpgconf --launch gpg-agent
          echo "$GPG_PRIVATE_KEY" | gpg --import
          echo "$GPG_KEY_ID:6:" | gpg --import-ownertrust
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Release APT repository
        run: |
          set -x
          gh release download $tag -p "*.deb" -D tmp
          pushd tmp
            apt-ftparchive packages . | tee Packages | xz > Packages.xz
            apt-ftparchive release -c ../apt/release.conf . > Release
            gpg --clearsign -o InRelease Release
            gpg --armor --detach-sign --sign -o Release.gpg Release
            gh release upload $tag InRelease Packages Packages.xz Release Release.gpg --clobber
          popd
        env:
          tag: ${{ needs.make-draft-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
