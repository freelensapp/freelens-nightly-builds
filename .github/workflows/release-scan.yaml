name: Release Scan

# Scans what the last nightly build actually shipped, from the SBOMs and the
# runtime package list published with it, and writes the report to the job
# summary of the run.
#
# The report stays in the run on purpose. It is not posted to a discussion, and
# it is not uploaded to code scanning: the nightly builds come from the
# upstream freelensapp/freelens main branch, whose own security scan already
# reports there, so the same findings in this repository would only duplicate
# them.
#
# This never builds anything: the release assets are the manifest of what users
# actually downloaded, so they are the only input. The working tree is checked
# out for mise.toml and mise.lock and nothing else.

on:
  workflow_dispatch: {}
  # Scans each nightly build as soon as it is published. workflow_run rather
  # than the release event, because the assets are uploaded to a draft that
  # Release nightly publishes at the end - waiting for the whole run is what
  # guarantees the SBOMs are there and the release is no longer a draft.
  #
  # Not a job inside Release nightly: a scan that fails because an advisory
  # feed is down or rate-limited would then mark an otherwise correct nightly
  # build as failed. A separate run keeps the release conclusion about the
  # release.
  #
  # Only the runs on main: a Release nightly run on a pull request builds
  # without publishing, so there is nothing new to scan after it.
  workflow_run:
    workflows:
      - Release nightly
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: scan the last nightly build

    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    env:
      # Renovate keeps this version up to date via the customManagers hint in
      # .renovaterc.json5. Stored without the leading "v" because that
      # manager's extractVersionTemplate strips it on every bump; grype's
      # installer needs the exact tag, so the "v" is re-added where this is
      # consumed rather than kept here (it would not survive).
      GRYPE_VERSION: 0.120.0 # datasource=github-releases depName=anchore/grype
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Only needed for mise.toml and mise.lock: every step below works on
      # release assets, not on the working tree.
      - name: Checkout
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.1 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7
        with:
          # The "v" is added here, not in GRYPE_VERSION: grype's install.sh
          # resolves the value as a literal git tag (releases are tagged
          # "v0.116.1"), and a bare version 404s.
          grype-version: v${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Download the assets of the last nightly build
        id: release
        run: |
          set -eo pipefail
          # The newest published release. Not `gh release view` without a tag:
          # that asks for the release GitHub marks as latest, which is not
          # necessarily the newest nightly build.
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [[ -z "$tag" ]]; then
            echo "No published release found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_OUTPUT"
          mkdir -p sboms prod
          # `|| true`: gh exits non-zero when a pattern matches nothing, which is
          # the "release predates this" case handled below, not an error.
          # The syft-json SBOMs, not the SPDX ones next to them: only syft-json
          # carries the Go symbols that let Grype match a Go advisory by the
          # functions it names rather than by the whole module.
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern '*-sbom.syft.json' --dir sboms || true
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern '*-prod-packages.json' --dir prod || true
          sboms=$(find sboms -name '*-sbom.syft.json' | wc -l)
          lists=$(find prod -name '*-prod-packages.json' | wc -l)
          echo "sboms=$sboms" >> "$GITHUB_OUTPUT"
          echo "lists=$lists" >> "$GITHUB_OUTPUT"
          echo "$tag publishes $sboms syft-json SBOM(s) and $lists runtime package list(s)"

      # A nightly build made before these assets were published has nothing to
      # scan. Say so in the summary instead of failing - the next nightly build
      # fixes it on its own.
      - name: Report a release without the assets to scan
        if: steps.release.outputs.sboms == '0' || steps.release.outputs.lists == '0'
        env:
          sboms: ${{ steps.release.outputs.sboms }}
        run: |
          set -eo pipefail
          if [[ "$sboms" -eq 0 ]]; then
            missing="ships no syft-json SBOM"
          else
            missing="ships SBOMs but no runtime package list, which this report needs to reduce them to what actually runs on a user's machine"
          fi
          {
            echo "The last nightly build, [\`${{ steps.release.outputs.tag }}\`](${{ steps.release.outputs.url }}), $missing: it predates publishing them."
            echo
            echo "This report starts with the first nightly build that publishes both."
          } > body.md

      # Every published SBOM is scanned, not just one: the per-platform SBOMs
      # differ (bundled kubectl/helm/proxy CLIs and their Go modules, native npm
      # build variants), so a single-platform scan has a permanent blind spot.
      #
      # The filtering is the same as in the release scan of
      # freelensapp/freelens, so the two reports are comparable.
      - name: Scan the SBOMs with Grype
        if: steps.release.outputs.sboms != '0' && steps.release.outputs.lists != '0'
        run: |
          set -eo pipefail
          grype="${{ steps.grype.outputs.cmd }}"
          mkdir -p jsons
          shopt -s nullglob
          # Read the <name>@<version> -> pnpm-store-path map published with the
          # release (reduced, so several of them merge). Only runtime findings
          # are reported: npm packages in this map, plus non-npm packages (Go
          # modules, native binaries) shipped under freelens/dist or
          # freelens/binaries. This drops build-time dev tools (esbuild,
          # typescript, ...) and the Go binaries bundled with them, which never
          # reach users.
          yq ea -pj -oj '. as $i ireduce ({}; . * $i)' prod/*-prod-packages.json > prod-set.json
          if [[ "$(yq -pj -oj 'length' prod-set.json)" -eq 0 ]]; then
            echo "Runtime package set is empty - refusing to scan (every npm finding would be dropped)" >&2
            exit 1
          fi
          for sbom in sboms/*-sbom.syft.json; do
            name=$(basename "$sbom" .syft.json)
            # Reduce the SBOM to runtime packages before scanning.
            # sub("\x5c"; "/"): the Windows SBOM records location paths with
            # backslashes, which the /freelens/... test below would never match -
            # every shipped non-npm package (Electron DLLs, node-pty, the bundled
            # Go CLIs) would silently drop out of the scan. \x5c rather than a
            # literal backslash because yq unescapes the string first, leaving
            # the regex engine a trailing backslash.
            #
            # The Go modules of Windows binaries (*.exe) are dropped too. Syft
            # reads symbols from ELF and Mach-O binaries only, so Grype matches
            # these by whole module and reports advisories for functions the
            # binary does not contain. The Linux and macOS builds of the same
            # CLIs come from the same modules and carry the symbols, and Grype's
            # symbol check does not look at GOOS, so an advisory against Windows
            # code still shows up through them when the vulnerable function is
            # compiled into those builds too.
            #
            # Relationships that point at a dropped package go with it, so the
            # decoder does not warn about every one of them. The dropped set is
            # selected and mapped in separate steps: yq builds an object from an
            # empty stream as {"value": true}, which from_entries rejects.
            yq -pj -oj '
              (load("prod-set.json")) as $set |
              .artifacts |= map(
                (.purl // "") as $purl |
                (.name + "@" + (.version // "")) as $key |
                (((.locations // [])[0].path // "") | sub("\\x5c"; "/")) as $path |
                .runtime = (
                  (($purl | test("^pkg:npm/")) and ($set[$key] != null))
                  or
                  (($purl | test("^pkg:npm/") | not) and ($path | test("^/freelens/(dist|binaries)/"))
                    and (($purl | test("^pkg:golang/") | not) or ($path | test("\\.exe$") | not)))
                )
              ) |
              (.artifacts | map(select(.runtime | not)) | map({"key": .id, "value": true}) | from_entries) as $dropped |
              .artifacts |= map(select(.runtime) | del(.runtime)) |
              .artifactRelationships |= ((. // []) | map(
                .parent as $parent | .child as $child |
                select(($dropped[$parent] == null) and ($dropped[$child] == null))
              ))
            ' "$sbom" > "runtime-${name}.syft.json"
            all=$(yq -pj -oj '.artifacts | length' "$sbom")
            run=$(yq -pj -oj '.artifacts | length' "runtime-${name}.syft.json")
            # Symbol capture failing would not fail the scan, only bring back the
            # whole-module matches this SBOM format is here to avoid - so say it
            # where it is seen rather than only in Grype's log.
            go=$(yq -pj -oj '[.artifacts[] | select((.purl // "") | test("^pkg:golang/"))] | length' "runtime-${name}.syft.json")
            symbols=$(yq -pj -oj '[.artifacts[] | select((.purl // "") | test("^pkg:golang/")) | select(((.metadata.symbols // {}) | length) > 0)] | length' "runtime-${name}.syft.json")
            if [[ "$go" -gt 0 && "$symbols" -eq 0 ]]; then
              echo "::warning::${sbom}: none of its ${go} runtime Go packages carries symbols - Go advisories are matched by whole module"
            fi
            echo "::group::grype ${sbom} (${all} -> ${run} runtime packages, ${symbols} of ${go} Go packages with symbols)"
            "$grype" "sbom:runtime-${name}.syft.json" -o json="jsons/${name}.json"
            echo "::endgroup::"
          done
          # grype leaves the artifact location empty for SBOM scans. For non-npm
          # packages (Go modules, native binaries) the SBOM location carries a
          # real path, so build a <name>@<version> -> path map. Build it from the
          # filtered SBOMs so a package present in several binaries (e.g. the Go
          # stdlib in kubectl and in the dev-only tsc binary) maps to a shipped
          # location, not a dropped build-time one.
          yq ea -pj -oj -I0 '[.]' runtime-*.syft.json |
            yq -pj -oj '
                [ .[].artifacts[]
                  | {
                      "key": (.name + "@" + (.version // "")),
                      "value": ((.locations // [])[0].path // "" | sub("\\x5c"; "/") | sub("^/"; ""))
                    }
                  | select(.value != "")
                ] | from_entries
              ' > sbom-paths.json
          # Merge the per-platform reports into one: dedupe matches by
          # vulnerability + package + version (a finding shared by every platform
          # is one row, not six) and resolve each match's location from its
          # <name>@<version> - the pnpm-store path for npm packages, the SBOM
          # location for non-npm ones, and a synthetic "sbom/<package>@<version>"
          # as a last resort.
          yq ea -pj -oj -I0 '[.]' jsons/*.json |
            yq -pj -oj '
                (load("prod-set.json")) as $prod |
                (load("sbom-paths.json")) as $paths |
                . as $x |
                {
                  "matches": (
                    [$x[].matches[]]
                    | unique_by(.vulnerability.id + "@" + .artifact.name + "@" + .artifact.version)
                    | map(
                        (.artifact.name + "@" + .artifact.version) as $key
                        | .artifact.locations = [{"path": ($prod[$key] // $paths[$key] // ("sbom/" + $key))}]
                      )
                  )
                }
              ' > grype.json

      - name: Build the vulnerability table
        if: steps.release.outputs.sboms != '0' && steps.release.outputs.lists != '0'
        run: |
          set -eo pipefail
          # Same shape as the release scan report of freelensapp/freelens.
          # severity/risk/type/installed version/fixed-in version come straight
          # from grype's JSON fields (mirroring its own default table columns);
          # the advisory link uses vulnerability.dataSource; the location is the
          # path the scan step already resolved. negrisk is a sort-only helper:
          # yq has no unary minus, so descending-by-risk needs the value
          # pre-negated.
          yq -pj -oj '
            ({"Critical":0,"High":1,"Medium":2,"Low":3,"Negligible":4,"Unknown":5}) as $rank
            | (.matches // [])
            | map(
                {
                  "severity": .vulnerability.severity,
                  "risk": (.vulnerability.risk // 0),
                  "package": .artifact.name,
                  "type": .artifact.type,
                  "installed": .artifact.version,
                  "fixed": ((.vulnerability.fix.versions // []) | join(", ")),
                  "advisory": ("[" + .vulnerability.id + "](" + (.vulnerability.dataSource // "") + ")"),
                  "location": (.artifact.locations[0].path // ""),
                  "rank": ($rank[.vulnerability.severity] // 9),
                  "negrisk": (0 - (.vulnerability.risk // 0))
                }
              )
            | sort_by(.rank, .negrisk, .package)
            | map(del(.rank) | del(.negrisk))
          ' grype.json > rows.json
          count=$(yq -pj -oj 'length' rows.json)
          {
            echo "Grype runtime vulnerability scan of the artifacts published with [\`${{ steps.release.outputs.tag }}\`](${{ steps.release.outputs.url }}), scanned from the ${{ steps.release.outputs.sboms }} SBOMs shipped with the release."
            echo
            if [[ "$count" -eq 0 ]]; then
              echo "No runtime vulnerabilities found."
            else
              echo "| Severity | Risk | Package | Type | Installed | Fixed In | Advisory | Location |"
              echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
              # LC_ALL=C: printf "%.1f" must use a period regardless of the
              # runner's locale, or it silently truncates "6.6" to "6" (parsed
              # up to the first non-digit) and re-renders it as "6,0".
              yq -pj -ot rows.json | tail -n +2 |
                LC_ALL=C awk -F'\t' '{printf "| %s | %.1f | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7, $8}'
            fi
          } > body.md
          echo "runtime vulnerabilities: $count"

      - name: Write the job summary
        run: |-
          set -eo pipefail
          {
            echo "## Release scan"
            echo
            cat body.md
          } >> "$GITHUB_STEP_SUMMARY"
